[package]
name = "ashellcore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
brush-core = { path = "../vendor/brush/brush-core" }
brush-builtins = { path = "../vendor/brush/brush-builtins" }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
regex-lite = "0.1.9"
futures = { version = "0.3.33", default-features = false, features = ["std"] }
libc = "0.2.189"
brush-coreutils-builtins = { version = "0.1.0", path = "../vendor/brush/brush-coreutils-builtins", features = ["coreutils.all"] }
uucore = "0.8"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
base64 = "0.23.0"
walkdir = "2.5.0"
similar = "3.1.1"
jaq-core = "3.1.0"
jaq-std = "3.0.1"
jaq-json = "2.0.1"
sedregex = "0.2.5"
ureq = "3.3.0"
flate2 = "1.1.9"
tar = "0.4.46"
zip = "8.6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
tokio-fd = "0.3"
# mosh AES-128-OCB3. Pinned exactly and version-coupled: ocb3 0.1 needs an
# `aes` on cipher 0.4 (= aes 0.8); aes 0.9 (cipher 0.5) will NOT satisfy
# ocb3 0.1's bounds. Do not bump either without re-verifying OCB3 interop
# against a real mosh-server (tests::mosh_live_probe in mosh_adapter/wire.rs).
ocb3 = "=0.1.0"
aes = "=0.8.4"

[profile.release]
opt-level = "s"
lto = true
# Panic strategy: UNWIND (not abort) on purpose. The uutils/awk/python
# adapters rely on `catch_unwind` to contain panics from vendored C / uucore
# code and restore process-global fds. `panic = "abort"` would make those
# catch_unwind guards useless. To keep panics from unwinding across the C ABI
# (which is UB), every #[no_mangle] export in lib.rs is itself wrapped in
# catch_unwind (see ffi_guard).

[patch.crates-io]
uucore = { path = "../vendor/patches/uucore" }
uu_date = { path = "../vendor/patches/uu_date" }
uu_cp = { path = "../vendor/patches/uu_cp" }
uu_tail = { path = "../vendor/patches/uu_tail" }
uu_whoami = { path = "../vendor/patches/uu_whoami" }

[[test]]
name = "battery"
harness = false

[[test]]
name = "concurrency"
harness = false

[features]
python = []
vision = []
node = []

[build-dependencies]
cc = "1.3.0"
