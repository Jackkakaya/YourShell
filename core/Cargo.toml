[package]
name = "ashellcore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
brush-core = { path = "../vendor/brush/brush-core" }
brush-builtins = { path = "../vendor/brush/brush-builtins" }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync", "fs"] }
regex-lite = "0.1.9"
futures = { version = "0.3.33", default-features = false, features = ["std"] }
libc = "0.2.189"
brush-coreutils-builtins = { version = "0.1.0", path = "../vendor/brush/brush-coreutils-builtins", features = ["coreutils.all"] }
uucore = "0.8"
# Official ripgrep CLI core with argv injection; no flags are mirrored here.
ripgrep-cli = { path = "../vendor/ripgrep-cli" }
# uutils/findutils — real GNU `find` (~75 predicates) and `xargs`. Vendored and
# patched with a pluggable exec seam because iOS forbids fork/exec; see
# vendor/patches/findutils/src/exec_hook.rs.
findutils = { path = "../vendor/patches/findutils" }
# uutils sed — real GNU sed (-i/-E/-n/-f/-s/-z…) replacing a 2-flag hand-written
# adapter over sedregex. Same `uumain(args)` entry shape as coreutils.
sed = "0.1"
# uutils grep — real GNU grep, replacing a hand-written CLI over ripgrep's
# engine. Same `uumain(args)` shape as coreutils. Pulls in oniguruma (C, MIT,
# built with cc like our vendored awk) for BRE/ERE/-P semantics that Rust's
# `regex` cannot express — backreferences and lookaround.
uu_grep = "0.1"
# uutils stat is not included in Brush's curated bundle; use the official
# crate directly so its complete parser/format semantics remain upstream-owned.
uu_stat = "0.8"
# uutils/diffutils — real `diff` (unified/context/ed/side-by-side) and `cmp`,
# replacing a 1-flag hand-written diff. Vendored: upstream exits the process on
# a bad flag and returns an opaque ExitCode. See vendor/patches/diffutils.
diffutils = { path = "../vendor/patches/diffutils" }
base64 = "0.23.0"
walkdir = "2.5.0"
flate2 = "1.1.9"
zip = "8.6.0"
# Supplies SQLite 3.46.0 itself. Its official CLI is compiled separately from
# vendor/sqlite-shell/shell.c and links to this same engine.
rusqlite = { version = "0.32", features = ["bundled"] }
# libgit2 supplies both smart HTTPS and SSH transports in-process. The SSH
# feature was explicitly cross-compiled for aarch64-apple-ios-sim before being
# enabled; authentication/known_hosts policy is implemented by our callbacks.
git2 = { version = "0.21.0", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
# Upstream Rust multi-connection downloader. Pinned because the repository has
# no stable crate release workflow; its own Clap parser remains authoritative.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
tokio-fd = "0.3"
# mosh AES-128-OCB3. Pinned exactly and version-coupled: ocb3 0.1 needs an
# `aes` on cipher 0.4 (= aes 0.8); aes 0.9 (cipher 0.5) will NOT satisfy
# ocb3 0.1's bounds. Do not bump either without re-verifying OCB3 interop
# against a real mosh-server (tests::mosh_live_probe in mosh_adapter/wire.rs).
ocb3 = "=0.1.0"
aes = "=0.8.4"

[profile.release]
opt-level = "s"
lto = true
# Panic strategy: UNWIND (not abort) on purpose. The uutils/awk/python
# adapters rely on `catch_unwind` to contain panics from vendored C / uucore
# code and restore process-global fds. `panic = "abort"` would make those
# catch_unwind guards useless. To keep panics from unwinding across the C ABI
# (which is UB), every #[no_mangle] export in lib.rs is itself wrapped in
# catch_unwind (see ffi_guard).

[patch.crates-io]
uucore = { path = "../vendor/patches/uucore" }
uu_date = { path = "../vendor/patches/uu_date" }
uu_cp = { path = "../vendor/patches/uu_cp" }
uu_tail = { path = "../vendor/patches/uu_tail" }
uu_whoami = { path = "../vendor/patches/uu_whoami" }

[[test]]
name = "battery"
harness = false

[[test]]
name = "concurrency"
harness = false

[[test]]
name = "concurrency_safe"
harness = false

[features]
python = []
vision = []
node = []

[build-dependencies]
cc = "1.3.0"

[[test]]
name = "flag_coverage"
harness = false

[[test]]
name = "git_compat"
harness = false

[[test]]
name = "ios_host"
harness = false

[[test]]
name = "command_inventory"
harness = false

[[test]]
name = "ssh_local"
harness = false
