[package]
name = "ripgrep-cli"
version = "15.1.0"
edition = "2024"
rust-version = "1.85"
license = "Unlicense OR MIT"
description = "Official ripgrep CLI core with an argv-injection host seam"

[dependencies]
anyhow = "1.0.75"
bstr = "1.7.0"
grep = "0.4.1"
ignore = "0.4.24"
lexopt = "0.3.0"
log = "0.4.5"
serde_json = "1.0.23"
termcolor = "1.1.0"
textwrap = { version = "0.16.0", default-features = false }

[features]
pcre2 = ["grep/pcre2"]
