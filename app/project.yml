name: AShellRS
options:
  bundleIdPrefix: dev.sumin
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  PythonIOSLib:
    path: ../vendor/python-ios-lib
targets:
  AShellRS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/Users/$USER/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          case "$PLATFORM_NAME" in
            iphonesimulator) YOURSHELL_PLATFORM="sim" ;;
            iphoneos) YOURSHELL_PLATFORM="device" ;;
            *) echo "Unsupported Apple platform: $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          YOURSHELL_IOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
          YOURSHELL_CARGO_FEATURES="python,node,vision" \
            "$PROJECT_DIR/../scripts/build-ios.sh" "$YOURSHELL_PLATFORM"
    postBuildScripts:
      - name: Prepare python-ios-lib native extensions
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        path: Scripts/prepare-python-ios-lib.sh
      - name: Prune platform-incompatible runtime assets
        basedOnDependencyAnalysis: false
        script: |
          "$PROJECT_DIR/Scripts/prune-ios-runtime.sh" \
            "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            "$PLATFORM_NAME"
    sources:
      - App
      - PyHost
      - NodeHost
      - path: PythonResources
        type: folder
        buildPhase: resources
      - path: NodeResources
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../vendor/python-ios/Python.xcframework
        embed: true
        codeSign: true
      - framework: ../vendor/nodejs-mobile/NodeMobile.xcframework
        embed: true
        codeSign: true
      - package: SwiftTerm
      - package: PythonIOSLib
        product: NumPy
      - package: PythonIOSLib
        product: SciPy
      - package: PythonIOSLib
        product: Pandas
      - package: PythonIOSLib
        product: Pillow
      - package: PythonIOSLib
        product: Lxml
      - package: PythonIOSLib
        product: Matplotlib
      # Matplotlib imports pyparsing while initializing its fontconfig
      # parser, but the upstream Matplotlib product does not currently list
      # that hard dependency.
      - package: PythonIOSLib
        product: Pyparsing
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging-Header.h
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/../core/target/aarch64-apple-ios-sim/release"]
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(PROJECT_DIR)/../core/target/aarch64-apple-ios/release"]
        OTHER_LDFLAGS: ["-lashellcore", "-liconv", "-larchive"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sumin.ashellrs
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Embedded Rust/Python runtime artifacts provide arm64 simulator
        # slices. Keep generic simulator builds from also requesting x86_64
        # on Intel-hosted CI runners.
        "ARCHS[sdk=iphonesimulator*]": arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
